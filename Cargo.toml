[package]
name = "docker-proxy"
version = "0.1.0"
edition = "2021"
default-run = "docker-proxy"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
ipnet = "2"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

[[bin]]
name = "docker-proxy"
path = "src/main.rs"

[[bin]]
name = "docker-proxy-setup"
path = "src/setup.rs"